services:
  postgres:
    image: postgres:15-alpine
    container_name: rentverse_db
    environment:
      POSTGRES_USER: amoeba
      POSTGRES_PASSWORD: pass123
      POSTGRES_DB: rentversedb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rentverse_network

  core-service:
    container_name: rentverse_core_service
    build:
      context: ./apps/core-service
      dockerfile: Dockerfile
    depends_on:
      - postgres
    env_file: ./apps/core-service/.env
    networks:
      - rentverse_network

  frontend:
    container_name: rentverse_frontend
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    env_file: ./apps/frontend/.env
    depends_on:
      - core-service
    networks:
      - rentverse_network

  # NEW: Added the prediction-service to our composition
  prediction-service:
    container_name: rentverse_prediction_service
    build:
      context: ./apps/prediction-service
      dockerfile: Dockerfile

    networks:
      - rentverse_network

networks:
  rentverse_network:
    driver: bridge

volumes:
  postgres_data:
