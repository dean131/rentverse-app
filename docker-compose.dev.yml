services:
  postgres:
    ports:
      - "5432:5432"
    networks:
      - tunnel

  core-service:
    command: npm run dev
    volumes:
      - ./apps/core-service:/app
      - /app/node_modules
    ports:
      - "8080:8080"
    networks:
      - tunnel

  frontend:
    command: npm run dev
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    env_file: ./apps/frontend/.env.dev
    networks:
      - tunnel

  prediction-service:
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./apps/prediction-service:/app
    ports:
      - "8000:8000"
    networks:
      - tunnel

networks:
  tunnel:
    external: true
