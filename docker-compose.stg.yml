services:
  postgres:
    ports:
      - "5432:5432"

  core-service:
    command: npm run dev
    volumes:
      - ./apps/core-service:/app
      - /app/node_modules
    ports:
      - "8180:8080"

  frontend:
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3100:3000"
    env_file: ./apps/frontend/.env.stg

  prediction-service:
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./apps/prediction-service:/app
    ports:
      - "8100:8000"
