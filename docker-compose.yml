services:
  postgres:
    image: postgres:15-alpine
    container_name: rentverse_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-dbadmin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dbadmin}
      POSTGRES_DB: ${DB_NAME:-rentversedb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rentverse_network

  minio:
    image: minio/minio:latest
    container_name: rentverse_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - rentverse_network

  core-service:
    container_name: rentverse_core_service
    build:
      context: ./apps/core-service
      dockerfile: Dockerfile
    command: npm run dev
    depends_on:
      - postgres
    env_file: ./apps/core-service/.env
    networks:
      - rentverse_network

  frontend:
    container_name: rentverse_frontend
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    depends_on:
      - core-service
    networks:
      - rentverse_network

  prediction-service:
    container_name: rentverse_prediction_service
    build:
      context: ./apps/prediction-service
      dockerfile: Dockerfile
    networks:
      - rentverse_network

networks:
  rentverse_network:
    driver: bridge

volumes:
  postgres_data:
  minio_data: 
